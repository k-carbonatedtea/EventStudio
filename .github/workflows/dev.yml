name: Dev Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-dev:
    name: Build Dev (Windows)
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      # 1. 检出源码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Node.js 运行环境 (Node 24.19.0)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. 配置 Rust 稳定版工具链
      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. 启用 Rust 构建缓存（加快后续构建速度）
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 5. 安装前端依赖
      - name: Install Frontend Dependencies
        run: npm ci

      # 6. 构建 Tauri 开发版应用
      - name: Build Tauri App
        run: npm run tauri build

      # 7. 上传 Dev 构建产物（可从 Actions 页面直接下载测试包）
      - name: Upload Dev Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EventStudio-Dev-Win64
          path: |
            src-tauri/target/release/event-studio.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
