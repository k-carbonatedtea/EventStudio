name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      # 1. 检出源码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Node.js 运行环境 (Node 22 LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. 配置 Rust 稳定版工具链
      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. 启用 Rust 构建缓存（加快后续构建速度）
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 5. 安装前端依赖
      - name: Install Frontend Dependencies
        run: npm ci

      # 6. 构建 Tauri 应用并自动发布 GitHub Release
      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Event Studio ${{ github.ref_name }}'
          releaseBody: 'Release ${{ github.ref_name }} - Automated build by GitHub Actions.'
          releaseDraft: false
          prerelease: false
